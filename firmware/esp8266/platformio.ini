; Sentinel-X — Edge Node ESP8266 (NodeMCU v2 / Wemos D1 mini : changer `board` si besoin)
; Compiler et téléverser : pio run -t upload   ·   moniteur série : pio device monitor
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags = -DFW_VERSION=\"0.1.0\"
extra_scripts = pre:build_time.py
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
